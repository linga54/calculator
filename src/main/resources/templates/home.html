<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calculatrice</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div>
        <h1>Calculatrice</h1>

        <div th:switch="${error}">
            <p th:case="'FirstNumberFormatError'">
                Wrong value provided for the first number - must be a number (use a dot for decimals)
            </p>
            <p th:case="'SecondNumberFormatError'">
                Wrong value provided for the second number - must be a number (use a dot for decimals)
            </p>
            <p th:case="'DivisionByZeroError'">
                Division by zero is not allowed
            </p>
            <p th:case="'ResultTooLargeError'">
                The result is too large
            </p>
            <p th:case="'OperationFormatError'">
                Wrong operation
            </p>
        </div>

        <form th:action="@{/calculate}" method="get">
            <table>
                <tr>
                    <td><label for="first">Premier nombre:</label></td>
                    <td><input type="text" id="first" name="first" th:value="${first}"></td>
                </tr>
                <tr>
                    <td><label for="second">Second nombre:</label></td>
                    <td><input type="text" id="second" name="second" th:value="${second}"></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <button type="submit" name="operation" value="ADD">+</button>
                        <button type="submit" name="operation" value="SUB">-</button>
                        <button type="submit" name="operation" value="MUL">*</button>
                        <button type="submit" name="operation" value="DIV">/</button>
                    </td>
                </tr>
                <tr>
                    <td><label for="result">Resultat:</label></td>
                    <td><input type="text" id="result" th:value="${result}" readonly></td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
